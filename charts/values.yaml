# Default values for domus.

global:
  # -- Registry prepended to image repository.
  imageRegistry: ghcr.io
  # -- Pull secrets for private registries, e.g. [{ name: ghcr }].
  imagePullSecrets: []

# -- Override chart name used in resource names.
nameOverride: ""
# -- Override full resource name prefix.
fullnameOverride: ""

replicaCount: 1

image:
  repository: paroki/domus
  # -- Defaults to chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent

port: 8080

config:
  appName: domus
  host: 0.0.0.0
  logLevel: info
  readTimeout: 10s
  writeTimeout: 10s
  idleTimeout: 60s
  shutdownTimeout: 10s
  bodyLimit: 4194304

# -- Extra environment variables for container.
extraEnv: []

# -- Extra envFrom sources (ConfigMapRef / SecretRef).
extraEnvFrom: []

serviceAccount:
  # -- Create ServiceAccount for release.
  create: true
  # -- Name of ServiceAccount. Defaults to full name when create is true.
  name: ""
  annotations: {}
  # -- Mount ServiceAccount token.
  automountToken: false

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: domus.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources: {}

hpa:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

pdb:
  enabled: false
  minAvailable: 1

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  # distroless "nonroot" user has uid/gid 65532.
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}
