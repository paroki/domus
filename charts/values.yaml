# Default values for domus.

global:
  # -- Registry prepended to image repository.
  imageRegistry: ghcr.io
  # -- Pull secrets for private registries, e.g. [{ name: ghcr }].
  imagePullSecrets: []

# -- Override chart name used in resource names.
nameOverride: ""
# -- Override full resource name prefix.
fullnameOverride: ""

replicaCount: 1

image:
  repository: paroki/domus
  # -- Defaults to chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent

port: 8080

config:
  logLevel: info
  user:
    # -- Bootstrap super admin email (USER_SUPER_ADMIN_EMAIL).
    superAdminEmail: ""
    superAdminName: Super Admin
    otpTtl: 5m
    otpMaxAttempts: 5
    otpCooldown: 60s
    sessionTtl: 720h
    cookieName: domus_session
    # -- Set true when served over HTTPS.
    cookieSecure: true
  sentry:
    # -- domus-api DSN (public). Empty disables Sentry.
    dsn: ""
    environment: production
    # -- Defaults to chart appVersion.
    release: ""
  smtp:
    # -- SMTP host (APP_SMTP_HOST). Empty disables SMTP and uses log OTP fallback.
    host: ""
    port: 587
    user: ""
    from: "Domus <no-reply@example.com>"

# -- Existing Secret holding optional keys: db-url (APP_DB_URL), google-id,
# google-secret, github-id, github-secret (AUTH_GOOGLE_*, AUTH_GITHUB_*),
# smtp-pass (APP_SMTP_PASS).
existingSecret: ""

# -- Extra environment variables for container.
extraEnv: []

# -- Extra envFrom sources (ConfigMapRef / SecretRef).
extraEnvFrom: []

serviceAccount:
  # -- Create ServiceAccount for release.
  create: true
  # -- Name of ServiceAccount. Defaults to full name when create is true.
  name: ""
  annotations: {}
  # -- Mount ServiceAccount token.
  automountToken: false

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: domus.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources: {}

hpa:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

pdb:
  enabled: false
  minAvailable: 1

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  # distroless "nonroot" user has uid/gid 65532.
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}
