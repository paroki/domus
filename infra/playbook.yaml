---
- name: Deploy Domus Services (Auth, API, Dash) and Infrastructure
  hosts: all
  become: true
  gather_facts: true

  vars:
    # Docker Network
    domus_network_name: "domus-net"
    domus_version: "latest"

    # Container Images
    auth_image: "ghcr.io/paroki/domus/auth:{{ domus_version }}"
    api_image: "ghcr.io/paroki/domus/api:{{ domus_version }}"
    dash_image: "ghcr.io/paroki/domus/dash:{{ domus_version }}"
    postgres_image: "postgres:18-alpine"
    redis_image: "redis:8-alpine"
    rustfs_image: "rustfs/rustfs:1.0.1"
    kafka_image: "apache/kafka:3.9.0"

    # Ports
    auth_port: 8001
    api_port: 8002
    dash_port: 3001
    postgres_port: 5432
    redis_port: 6379
    rustfs_port: 9000
    rustfs_console_port: 9001
    kafka_port: 9092

    # Database & Storage Credentials
    postgres_user: "domus"
    postgres_password: "domus"
    postgres_db: "domus"

    rustfs_access_key: "rustfsadmin"
    rustfs_secret_key: "rustfsadmin"

    # Volume Paths
    postgres_data: /srv/domus/pgdata
    kafka_data: /srv/domus/kafka
    redis_data: /srv/domus/redis
    rustfs_data: /srv/domus/rustfs

    auth_url: "http://localhost:8001"
    api_url: "http://localhost:8002"
    dash_url: "http://localhost:3001"

    # Application Environment Variables
    domus_env:
      NODE_ENV: "production"
      PORT: "3001"
      AUTH_PORT: "8001"
      AUTH_URL: "{{ auth_url }}"
      AUTH_HOST: "0.0.0.0"
      AUTH_PATH: ""
      AUTH_SECRET: "6171ce314c622f9a4cdb542c810d40b91edde2f659bcd5224c6aeee7d7ea4925"
      AUTH_TRUSTED_ORIGINS: "http://localhost:3000,http://localhost:3001,http://localhost:8002"
      AUTH_DB_URL: "postgres://{{ postgres_user }}:{{ postgres_password }}@domus-db:5432/{{ postgres_db }}"
      API_DB_URL: "postgres://{{ postgres_user }}:{{ postgres_password }}@domus-db:5432/{{ postgres_db }}?sslmode=disable"
      REDIS_URL: "redis://domus-redis:6379"
      S3_ENDPOINT: "http://domus-rustfs:9000"
      S3_ACCESS_KEY: "{{ rustfs_access_key }}"
      S3_SECRET_KEY: "{{ rustfs_secret_key }}"
      S3_REGION: "us-east-1"
      S3_FORCE_PATH_STYLE: "true"
      KAFKA_BROKERS: "domus-kafka:9092"
      VITE_AUTH_URL: "{{ auth_url }}"
      VITE_API_URL: "{{ api_url }}"
      VITE_PUBLIC_URL: "{{ dash_url }}"

  tasks:
    - name: Ensure Docker bridge network exists
      community.docker.docker_network:
        name: "{{ domus_network_name }}"
        state: present

    - name: Ensure Docker volumes exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      with_items:
        - "{{ postgres_data }}"
        - "{{ redis_data }}"
        - "{{ rustfs_data }}"
        - "{{ kafka_data }}"

    # --- Supporting Infrastructure Services ---

    - name: Deploy PostgreSQL container
      community.docker.docker_container:
        name: domus-db
        image: "{{ postgres_image }}"
        state: started
        restart_policy: unless-stopped
        networks:
          - name: "{{ domus_network_name }}"
        env:
          POSTGRES_USER: "{{ postgres_user }}"
          POSTGRES_PASSWORD: "{{ postgres_password }}"
          POSTGRES_DB: "{{ postgres_db }}"
        volumes:
          - "{{ postgres_data }}:/var/lib/postgresql"
        published_ports:
          - "7432:5432"
        healthcheck:
          test: ["CMD-SHELL", "pg_isready -U {{ postgres_user }} -d {{ postgres_db }}"]
          interval: 5s
          timeout: 3s
          retries: 10

    - name: Deploy Redis container
      community.docker.docker_container:
        name: domus-redis
        image: "{{ redis_image }}"
        state: started
        restart_policy: unless-stopped
        command: ["redis-server", "--appendonly", "yes"]
        networks:
          - name: "{{ domus_network_name }}"
        published_ports:
          - "{{ redis_port }}:6379"
        volumes:
          - "{{ redis_data }}:/data"
        healthcheck:
          test: ["CMD", "redis-cli", "ping"]
          interval: 5s
          timeout: 3s
          retries: 10

    - name: Deploy RustFS S3 container
      community.docker.docker_container:
        name: domus-rustfs
        image: "{{ rustfs_image }}"
        state: started
        restart_policy: unless-stopped
        command: /data
        networks:
          - name: "{{ domus_network_name }}"
        published_ports:
          - "{{ rustfs_port }}:9000"
          - "{{ rustfs_console_port }}:9001"
        env:
          RUSTFS_ACCESS_KEY: "{{ rustfs_access_key }}"
          RUSTFS_SECRET_KEY: "{{ rustfs_secret_key }}"
          RUSTFS_ADDRESS: ":9000"
          RUSTFS_CONSOLE_ADDRESS: ":9001"
          RUSTFS_CONSOLE_ENABLE: "true"
        volumes:
          - "{{ rustfs_data }}:/data"

    - name: Deploy Kafka container
      community.docker.docker_container:
        name: domus-kafka
        image: "{{ kafka_image }}"
        state: started
        restart_policy: unless-stopped
        networks:
          - name: "{{ domus_network_name }}"
        published_ports:
          - "{{ kafka_port }}:9092"
        env:
          KAFKA_NODE_ID: "1"
          KAFKA_PROCESS_ROLES: "broker,controller"
          KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
          KAFKA_LISTENERS: "INTERNAL://:9092,CONTROLLER://:9093"
          KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092"
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
          KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
          KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
          KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
        volumes:
          - "{{ kafka_data }}:/var/lib/kafka/data"
        healthcheck:
          test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
          interval: 10s
          timeout: 10s
          retries: 10
          start_period: 20s

    # --- Application Services (Auth, API, Dash) ---

    - name: Pull and deploy Auth container
      community.docker.docker_container:
        name: domus-auth
        image: "{{ auth_image }}"
        pull: true
        state: started
        restart_policy: unless-stopped
        networks:
          - name: "{{ domus_network_name }}"
        published_ports:
          - "{{ auth_port }}:8001"
        env: "{{ domus_env }}"

    - name: Pull and deploy API container
      community.docker.docker_container:
        name: domus-api
        image: "{{ api_image }}"
        pull: true
        state: started
        restart_policy: unless-stopped
        networks:
          - name: "{{ domus_network_name }}"
        published_ports:
          - "{{ api_port }}:8002"
        env: "{{ domus_env }}"

    - name: Pull and deploy Dash container
      community.docker.docker_container:
        name: domus-dash
        image: "{{ dash_image }}"
        pull: true
        state: started
        restart_policy: unless-stopped
        networks:
          - name: "{{ domus_network_name }}"
        published_ports:
          - "{{ dash_port }}:3001"
        env: "{{ domus_env }}"

