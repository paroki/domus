name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ui:
    name: UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Biome check
        run: bunx @biomejs/biome@2.6.7 check app

      - name: Run typecheck
        run: bun run typecheck

      - name: Run UI tests
        run: bun test --pass-with-no-tests

      - name: Build UI bundle
        run: bun run build

  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check Go format
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "Unformatted Go files:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Verify generated mocks
        run: |
          go install go.uber.org/mock/mockgen@v0.6.0
          go generate ./...
          git diff --exit-code

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          repo-checkout: false
          go-version-file: go.mod
          cache-dependency-path: go.sum
          go-package: ./...

      - name: Run Go tests
        run: go test -v -race ./...

  helm:
    name: Helm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Lint and render Helm chart
        run: |
          helm lint charts --strict
          helm template domus charts > /dev/null

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install UI dependencies
        run: bun install --frozen-lockfile --cwd ui

      - name: Install E2E dependencies
        run: bun install --frozen-lockfile --cwd e2e

      - name: Run Biome check
        run: bunx @biomejs/biome@2.6.7 check e2e

      - name: Run E2E typecheck
        run: bun run --cwd e2e typecheck

      - name: Install Playwright Chromium
        run: cd e2e && bunx playwright install --with-deps chromium

      - name: Run E2E tests
        run: bun run --cwd e2e e2e

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: e2e/reports
          if-no-files-found: ignore
          retention-days: 7
