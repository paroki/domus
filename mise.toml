[tools]
air = "latest"
biome = "latest"
go = "latest"
golangci-lint = "latest"
node = "26"
swag = "v2.0.0-rc6"

[tasks."dev:backend"]
description = "Run Go backend dev server with air"
run = "air"

[tasks."dev:ui"]
description = "Run React Router UI dev server"
dir = "ui"
run = "bun run dev"

[tasks.dev]
description = "Run full dev stack concurrently"
depends = ["dev:backend", "dev:ui"]

[tasks."build:ui"]
description = "Build UI bundle"
dir = "ui"
run = "bun run build"

[tasks."build:backend"]
description = "Build Go binary"
run = "go build -o bin/domus ./cmd/domus"

[tasks.build]
description = "Build UI bundle and Go binary"
run = "mise run build:ui && mise run build:backend"

[tasks."fmt:backend"]
description = "Format Go code with gofmt"
run = "gofmt -w ."

[tasks."fmt:ui"]
description = "Format UI code with Biome"
dir = "ui"
run = "biome format --write ."

[tasks.fmt]
description = "Format backend and UI code"
depends = ["fmt:backend", "fmt:ui"]

[tasks."fmt:check:backend"]
description = "Check Go formatting"
run = 'test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)'

[tasks."fmt:check:ui"]
description = "Check UI formatting with Biome"
dir = "ui"
run = "biome format ."

[tasks."fmt:check"]
description = "Check backend and UI formatting"
depends = ["fmt:check:backend", "fmt:check:ui"]

[tasks."lint:backend"]
description = "Lint Go code (feature and layer boundaries via depguard)"
run = "golangci-lint run"

[tasks."lint:vet"]
description = "Run go vet"
run = "go vet ./..."

[tasks."lint:ui"]
description = "Lint UI code with Biome"
dir = "ui"
run = "biome lint ."

[tasks."lint:helm"]
description = "Lint and render Helm chart"
run = "helm lint charts --strict && helm template domus charts > /dev/null"

[tasks.lint]
description = "Run all linters (backend, vet, UI, Helm)"
depends = ["lint:backend", "lint:vet", "lint:ui", "lint:helm"]

[tasks.vuln]
description = "Run govulncheck on Go packages"
run = "govulncheck ./..."

[tasks."test:backend"]
description = "Run Go tests with race detector"
run = "go test -race ./..."

[tasks."test:ui"]
description = "Run UI typecheck and tests"
dir = "ui"
run = "bun run typecheck && bun test"

[tasks.test]
description = "Run backend and UI tests"
depends = ["test:backend", "test:ui"]

[tasks."generate:api"]
description = "Generate OpenAPI spec via swag"
run = "swag init -g internal/app/fiber.go -o api"

[tasks."generate:ui"]
description = "Generate TypeScript API types from OpenAPI spec"
dir = "ui"
run = "bunx openapi-typescript ../api/swagger.json -o app/shared/api/schema.d.ts"

[tasks.generate]
description = "Generate OpenAPI spec and UI schema types"
run = "mise run generate:api && mise run generate:ui"

[tasks.check]
description = "Run all CI checks locally"
run = "mise run fmt:check && mise run lint && mise run vuln && mise run test && mise run build:ui"

[tasks.clean]
description = "Remove build artifacts"
run = "rm -rf bin tmp ui/build .cr-release-packages"
