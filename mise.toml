[tools]
air = "latest"
atlas = "1.3.0"
biome = "2.6.7"
go = "latest"
golangci-lint = "2.15.0"
"go:go.uber.org/mock/mockgen" = "0.6.0"
node = "26"
swag = "v2.0.0-rc6"

# --- Dev ---
[tasks."dev:api"]
description = "Run Go API dev server with air"
run = "air"

[tasks."dev:ui"]
description = "Run React Router UI dev server"
dir = "ui"
run = "bun run dev"

[tasks.dev]
description = "Run full dev stack concurrently"
depends = ["dev:api", "dev:ui"]

# --- Codegen ---
[tasks."api:spec"]
description = "Generate OpenAPI 3.1 spec via swag"
run = "swag init --v3.1 -d cmd/domus,internal/app,internal/platform/httpx,internal/user/handler,internal/user/domain,internal/ref/handler,internal/ref/domain,internal/org/handler,internal/org/domain,internal/event/handler,internal/event/domain -g main.go --parseInternal --outputTypes json -o api"

[tasks."api:types"]
description = "Generate TypeScript API schema from OpenAPI spec"
run = "bun run --cwd ui api:types && biome check --write ui/app/shared/api/schema.d.ts"

[tasks.api]
description = "Generate OpenAPI 3.1 spec and TypeScript schema"
run = ["mise run api:spec", "mise run api:types"]

[tasks.mock]
description = "Generate Go mocks via go generate"
run = "go generate ./..."

[tasks.ent]
description = "Generate Entgo graph client"
run = "go generate ./ent/..."

[tasks."migrate:diff"]
description = "Generate a new Atlas SQL migration from Ent schema"
run = "atlas migrate diff --env local"

[tasks."migrate:lint"]
description = "Validate Atlas migration directory"
run = "atlas migrate validate --env local"

# --- Build ---
[tasks."build:ui"]
description = "Build UI bundle"
dir = "ui"
run = "bun run build && mkdir -p build/client && touch build/client/.keep"

[tasks."build:api"]
description = "Build Go API binary"
run = "go build -o bin/domus ./cmd/domus"

[tasks.build]
description = "Build UI bundle then Go binary"
run = ["mise run build:ui", "mise run build:api"]

# --- Test ---
[tasks."test:api"]
description = "Run Go tests with race detector"
run = "go test -race ./..."

[tasks."test:ui"]
description = "Run UI tests"
dir = "ui"
run = "bun test --pass-with-no-tests"

[tasks.test]
description = "Run API and UI tests"
depends = ["test:api", "test:ui"]

# --- Dev Utilities ---
[tasks."fmt:api"]
description = "Format Go files"
run = "gofmt -w ."

[tasks."fmt:ui"]
description = "Format and organize UI imports via biome"
run = "biome check --write ui/app"

[tasks.fmt]
description = "Format API and UI code"
depends = ["fmt:api", "fmt:ui"]

[tasks.tidy]
description = "Tidy Go modules"
run = "go mod tidy"

[tasks.clean]
description = "Clean build and temp artifacts"
run = "rm -rf bin tmp api ui/build && mkdir -p ui/build/client && touch ui/build/client/.keep"

[tasks."lint:helm"]
description = "Lint and template-check Helm chart"
run = "helm lint charts --strict && helm template domus charts > /dev/null"

[tasks."check:env"]
description = "Verify every Go env var is in .env.example and the helm chart"
run = '''
#!/usr/bin/env bash
set -uo pipefail
failed=0
vars=$(grep -rhoE 'env:"[A-Z0-9_]+' --include='*.go' internal cmd | grep -v _test | sed 's/env:"//' | sort -u)
for v in $vars; do
  grep -qE "^${v}=" .env.example || { echo "missing in .env.example: $v"; failed=1; }
  grep -q "\"$v\"\|name: $v\$" charts/templates/_helpers.tpl || { echo "missing in chart: $v"; failed=1; }
done
# chart-only vars (HOST/PORT are mapped from values) are covered by the loop above.
exit "$failed"
'''

# --- Quality Control (continue on failure, report at end) ---
[tasks."qc:api"]
description = "Run all API format, vet, lint, vulncheck, and test checks"
run = '''
#!/usr/bin/env bash
set -uo pipefail
report=()
failed=0

run_check() {
  local name="$1"; shift
  echo "==> [qc:api] $name"
  if "$@"; then
    report+=("PASS: $name")
  else
    report+=("FAIL: $name")
    failed=1
  fi
}

check_gofmt() {
  local out
  out=$(gofmt -l .)
  if [ -n "$out" ]; then
    echo "Unformatted files:"
    echo "$out"
    return 1
  fi
}

run_check "gofmt" check_gofmt
run_check "go vet" go vet ./...
run_check "golangci-lint" golangci-lint run ./...
run_check "govulncheck" govulncheck ./...
run_check "go test -race" go test -race ./...
run_check "env vars" mise run check:env

echo ""
echo "=== qc:api summary ==="
printf '  %s\n' "${report[@]}"
exit "$failed"
'''

[tasks."qc:ui"]
description = "Run all UI format/lint, typecheck, test, and build checks"
run = '''
#!/usr/bin/env bash
set -uo pipefail
report=()
failed=0

run_check() {
  local name="$1"; shift
  echo "==> [qc:ui] $name"
  if "$@"; then
    report+=("PASS: $name")
  else
    report+=("FAIL: $name")
    failed=1
  fi
}

run_check "biome check" biome check ui/app
run_check "typecheck" bun run --cwd ui typecheck
run_check "test" bun test --cwd ui --pass-with-no-tests
run_check "build" mise run build:ui

echo ""
echo "=== qc:ui summary ==="
printf '  %s\n' "${report[@]}"
exit "$failed"
'''

[tasks.qc]
description = "Run qc:api and qc:ui (continue on failure, report at end)"
run = '''
#!/usr/bin/env bash
set -uo pipefail
report=()
failed=0

for task in qc:api qc:ui; do
  if mise run "$task"; then
    report+=("PASS: $task")
  else
    report+=("FAIL: $task")
    failed=1
  fi
done

echo ""
echo "=== qc summary ==="
printf '  %s\n' "${report[@]}"
exit "$failed"
'''
